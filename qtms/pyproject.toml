[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qtms"
version = "0.1.0"
description = "QTMS — Quantum Trading Multi-Layer Stacking Operation (local-first, paper-first)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
]

[project.optional-dependencies]
test = ["pytest>=7.4", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["qtms*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
